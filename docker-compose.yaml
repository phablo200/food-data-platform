services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: food-data-platform-api
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
  db:
    image: postgres:16-alpine
    container_name: food-data-platform-db
    environment:
      POSTGRES_DB: food_data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: food-data-platform-redis
    # ports:
    #   - "6379:6379"

volumes:
  pgdata:
